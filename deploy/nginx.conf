server {
    listen 80;
    listen [::]:80;
    server_name demo.m1ntch0c0.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name demo.m1ntch0c0.com;

    ssl_certificate /etc/letsencrypt/live/demo.m1ntch0c0.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo.m1ntch0c0.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 1m;

    location = / {
        return 302 /algostage;
    }

    location = /algostage {
        proxy_pass http://127.0.0.1:3100;
        include /etc/nginx/snippets/algostage-proxy.conf;
    }

    location ^~ /algostage/ {
        # 保留子路径；Next.js 的 basePath 在构建时已设为 /algostage。
        proxy_pass http://127.0.0.1:3100;
        include /etc/nginx/snippets/algostage-proxy.conf;
    }

    location / {
        return 404;
    }
}
