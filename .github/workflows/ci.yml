name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_BASE_PATH: ""
      AI_API_KEY: ""
      AI_MODEL: ""
      AI_PROVIDER: ""
      AI_BASE_URL: "http://127.0.0.1:1/no-model"
      NGINX_BINARY: /usr/sbin/nginx
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - name: 安装流式代理回归依赖
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends nginx
      - run: npm run lint
      - run: npm run typecheck
      # Run the complete suite once, with the core coverage gate enabled.
      - run: npm test -- --coverage
      - run: node --import tsx scripts/check-core-coverage.ts
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            coverage/
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p backups && touch prisma/ci-decoy.db backups/ci-decoy.tgz .env.ci-decoy
      - run: docker build --tag algostage:ci .
      - run: docker run --rm --entrypoint bash -v "$PWD/scripts/check-image-contents.sh:/check.sh:ro" algostage:ci /check.sh /app
